<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>visual-check — calibração</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; }
  #w { font: bold 48px/1.2 monospace; padding: 16px; }
</style>
</head>
<body>
<!-- Página de controle do visual-check: o PNG capturado tem de mostrar W igual à largura pedida. -->
<div id="w">W=?</div>
<script>
  document.getElementById('w').textContent = 'W=' + window.innerWidth + ' D=' + window.devicePixelRatio;
</script>
</body>
</html>
